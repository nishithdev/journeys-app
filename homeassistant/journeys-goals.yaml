# Journeys — Goals & habits add-on for Home Assistant (optional)
#
# Only needed if you turned on Goals & habits in the app (Settings → Add-ons).
# Install it next to journeys.yaml, the same way:
# 1. Copy this file to /config/packages/journeys-goals.yaml
# 2. Replace JOURNEYS_SERVER below with your server's address, e.g. http://192.168.1.20:8080
# 3. If you set APP_TOKEN, uncomment the `headers:` blocks (they use the same journeys_auth secret).
# 4. Developer tools → YAML → Check configuration, then restart Home Assistant.
#
# What you get:
# - sensor.habits_open_today   habits still to do today (attributes: every habit with its streak)
# - sensor.habits_done_today   habits done today
# - sensor.goals_stalled       goals with no progress for a while (attributes: every active goal)
# - The Done / Use a skip / In 1 hour buttons on evening check-ins, and Log progress / Not now on
#   stalled-goal nudges, send their answer back to the Journeys server.

rest:
  - resource: JOURNEYS_SERVER/api/goals/ha
    scan_interval: 300
    timeout: 20
    # headers:
    #   Authorization: !secret journeys_auth
    sensor:
      - name: Habits open today
        unique_id: journeys_habits_open_today
        icon: mdi:checkbox-blank-circle-outline
        state_class: measurement
        value_template: "{{ value_json.habits_due }}"
        json_attributes:
          - habits
          - habits_today
          - updated
      - name: Habits done today
        unique_id: journeys_habits_done_today
        icon: mdi:check-circle-outline
        state_class: measurement
        value_template: "{{ value_json.habits_done }}"
      - name: Goals stalled
        unique_id: journeys_goals_stalled
        icon: mdi:target
        state_class: measurement
        value_template: "{{ value_json.goals_stalled }}"
        json_attributes:
          - goals
          - goals_active

rest_command:
  journeys_goals_action:
    url: JOURNEYS_SERVER/api/goals/ha/action
    method: POST
    content_type: application/json
    timeout: 20
    payload: '{"action": {{ action | tojson }}, "reply": {{ reply | default("", true) | tojson }}}'
    # headers:
    #   Authorization: !secret journeys_auth

automation:
  # Sends check-in and goal button taps back to the Journeys server.
  - id: journeys_goals_notification_action
    alias: Journeys - habit and goal buttons
    mode: queued
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: >
          {% set a = trigger.event.data.action | default('') %}
          {{ a.startswith('HABIT_') or a.startswith('GOAL_') }}
    actions:
      - action: rest_command.journeys_goals_action
        data:
          action: "{{ trigger.event.data.action }}"
          reply: "{{ trigger.event.data.reply_text | default('') }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.habits_open_today

  # Example: check a habit off automatically from a sensor. Copy the habit's ID from its screen in the app
