<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8">
  <meta name="description" content="Track life journeys step by step and see how many days passed between each step.">
  <title>Journeys</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Journeys">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load in the background: the page never waits on Google to draw (system font until they arrive). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  <style>
    /* Shown the moment the page arrives, until the app draws its first screen. Self-contained on purpose. */
    html, body { margin: 0; background: #F5F6F8; }
    .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #16213A; }
    .boot img { width: 76px; height: 76px; border-radius: 22px; box-shadow: 0 8px 24px rgba(22, 33, 58, .14); }
    .boot b { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
    .boot i { display: block; width: 120px; height: 4px; border-radius: 2px; background: #E3E6EE; overflow: hidden; position: relative; }
    .boot i::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #2451D6; animation: boot 1.1s ease-in-out infinite; }
    .boot small { font-size: 13px; color: #6B7385; min-height: 1em; }
    @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .boot i::after { animation: none; width: 100%; opacity: .5; } }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" aria-live="polite"><div class="boot" role="status"><img src="icons/icon-192.png" alt=""><b>Journeys</b><i></i><small id="boot-note"></small></div></div>
  <script>
    // If the app takes a while (a slow connection to the server), say so instead of looking stuck.
    setTimeout(function () { var n = document.getElementById('boot-note'); if (n) n.textContent = 'Still loading… your server is answering slowly.'; }, 6000);
  </script>
  <noscript>Journeys needs JavaScript turned on.</noscript>
  <script src="app.js"></script>
</body>
</html>
